name: Release
# Publishes a GitHub release when the version in module.json changes on main.
on:
  push:
    branches: [main]
    paths: [module.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          V=$(jq -r .version module.json); echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check download URL matches version
        if: steps.v.outputs.exists == 'false'
        run: |
          jq -e --arg v "${{ steps.v.outputs.version }}" '.download | endswith("/v" + $v + "/module.zip")' module.json
      - name: Build
        if: steps.v.outputs.exists == 'false'
        run: ./build.sh
      - name: Create release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          awk -v v="$V" '$0 ~ "^## "v {f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release create "v$V" dist/module.zip dist/module.json --title "v$V" --notes-file notes.md
