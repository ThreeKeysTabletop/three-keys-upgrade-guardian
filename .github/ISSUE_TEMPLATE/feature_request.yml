name: Feature request
description: Suggest an idea for Upgrade Guardian
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Describe the feature you want }
    validations: { required: true }
  - type: textarea
    id: alt
    attributes: { label: Alternatives you have considered }
